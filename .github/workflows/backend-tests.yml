# 백엔드 자동 테스트(CI)
# push·PR마다 GitHub의 임시 컴퓨터에서 일회용 PostgreSQL을 띄워 백엔드 테스트 전체를 실행한다.
# 실제 개인정보·식품 원본·비밀키를 사용하지 않는다. 테스트는 가상 데이터만 쓴다.
name: Backend tests

on:
  push:
    branches: [main]
  pull_request:

# 코드 읽기 권한만 준다(최소 권한).
permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: unittest (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      # 한 버전이 실패해도 다른 버전 결과를 끝까지 본다.
      fail-fast: false
      matrix:
        # 16: 로컬 개발 DB, 18: 외부 테스트 DB(Neon)
        postgres: ['16', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          # 실행기 안에서만 접속 가능하고 작업이 끝나면 사라지는 일회용 DB의 가짜 비밀번호다.
          # 실제 데이터가 없으므로 GitHub Secrets를 쓰지 않는다.
          POSTGRES_PASSWORD: ci-only-owner-password
          POSTGRES_DB: nourishon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nourishon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NOURISHON_CI_OWNER_DATABASE_URL: host=localhost port=5432 user=postgres password=ci-only-owner-password dbname=nourishon_test
      NOURISHON_CI_APP_PASSWORD: ci-only-app-password
      # 테스트는 권한이 좁은 앱 역할로 접속한다(실제 서버와 같은 조건).
      NOURISHON_TEST_DATABASE_URL: host=localhost port=5432 user=nourishon_app password=ci-only-app-password dbname=nourishon_test

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.3'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Prepare test database (migrate + app role)
        run: python -B scripts/ci-prepare-db.py

      - name: Run backend tests (fail on any skip)
        shell: bash
        run: |
          set -o pipefail
          python -B -m unittest discover -s tests -v 2>&1 | tee unittest.log
          # unittest는 건너뛴 테스트가 있어도 성공으로 끝난다.
          # DB 설정이 빠져 보안 테스트가 조용히 빠지는 것을 막기 위해 건너뜀이 있으면 실패 처리한다.
          if grep -q "skipped=" unittest.log; then
            echo "::error::건너뛴 테스트가 있습니다. CI에서는 건너뜀 0이어야 합니다."
            grep -i "skipped '" unittest.log || true
            exit 1
          fi
